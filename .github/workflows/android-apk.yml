```yaml
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar dependências
        run: npm install

      - name: Criar o projeto Android (se ainda não existir)
        run: '[ -d android ] || npx cap add android'

      - name: Gerar ícones do app
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Copiar o site para o Android
        run: npx cap sync android

      - name: Compilar o APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vocabulary-games.apk

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-games-apk
          path: vocabulary-games.apk

      - name: Publicar na aba Releases (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vocabulary-games.apk
```